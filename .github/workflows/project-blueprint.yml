name: Project Blueprint

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read
  issues: write

concurrency:
  group: project-blueprint-${{ github.repository }}
  cancel-in-progress: false

jobs:
  render:
    name: Render native milestone DAG
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Collect native M10-M12 graph
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const labels = ["M10", "M11", "M12"];
            const issueNumbers = new Set();
            for (const label of labels) {
              const issues = await github.paginate(github.rest.issues.listForRepo, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: "all",
                labels: label,
                per_page: 100,
              });
              for (const issue of issues) {
                if (!issue.pull_request) issueNumbers.add(issue.number);
              }
            }

            const query = `query($owner: String!, $repo: String!, $number: Int!) {
              repository(owner: $owner, name: $repo) {
                issue(number: $number) {
                  number title url state
                  parent { number }
                  subIssues(first: 100) { nodes { number } }
                  blockedBy(first: 100) { nodes { number } }
                  blocking(first: 100) { nodes { number } }
                  projectItems(first: 20) {
                    nodes {
                      project { id }
                      fieldValueByName(name: "Workflow") {
                        ... on ProjectV2ItemFieldSingleSelectValue { name }
                      }
                    }
                  }
                }
              }
            }`;
            const projectId = "PVT_kwHOA-xhv84BcK_0";
            const issues = [];
            for (const number of [...issueNumbers].sort((a, b) => a - b)) {
              const result = await github.graphql(query, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                number,
              });
              const issue = result.repository.issue;
              const projectItem = issue.projectItems.nodes.find(item => item.project.id === projectId);
              issues.push({
                number: issue.number,
                title: issue.title,
                url: issue.url,
                state: issue.state,
                workflow: projectItem?.fieldValueByName?.name ?? null,
                parent: issue.parent?.number ?? null,
                subIssues: issue.subIssues.nodes.map(child => child.number),
                blockedBy: issue.blockedBy.nodes.map(blocker => blocker.number),
                blocking: issue.blocking.nodes.map(blocked => blocked.number),
              });
            }
            fs.writeFileSync("project-blueprint.json", JSON.stringify({
              title: "M10-M12 Native Work Graph",
              issues,
            }, null, 2));

      - name: Render Mermaid artifact
        run: |
          dotnet run --project tools/ProjectBlueprint/ProjectBlueprint.csproj -- project-blueprint.json project-blueprint.md

      - name: Upload blueprint artifact
        uses: actions/upload-artifact@v4
        with:
          name: project-blueprint-${{ github.run_id }}
          path: project-blueprint.md
          if-no-files-found: error

      - name: Update #593 blueprint status
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- project-blueprint -->";
            const body = `${marker}\n${fs.readFileSync("project-blueprint.md", "utf8")}\nArtifact: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 593,
              per_page: 100,
            });
            const existing = comments.find(comment => comment.user?.type === "Bot" && comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: 593,
                body,
              });
            }

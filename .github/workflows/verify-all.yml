name: VerifyAll

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'codex/**'

permissions:
  contents: read

concurrency:
  group: verify-all-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_ROLL_FORWARD: Major
  DOTNET_INSTALL_DIR: ~/.dotnet
  GODOT_VERSION: "4.7"
  GODOT_RELEASE: "stable"

jobs:
  verify-all:
    name: VerifyAll
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Install hosted runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl unzip xvfb file fontconfig fonts-noto-core fonts-noto-cjk
          fc-cache -f

      - name: Install Godot .NET
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/godot"
          archive="${RUNNER_TEMP}/godot/godot-dotnet.zip"
          release="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_mono_linux_x86_64.zip"
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 300 "$release" --output "$archive"
          unzip -q "$archive" -d "${RUNNER_TEMP}/godot"
          godot_bin="$(find "${RUNNER_TEMP}/godot" -type f -name "Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_mono_linux.x86_64" | head -n 1)"
          if [ -z "$godot_bin" ]; then
            echo "Godot .NET executable was not found after extracting $archive" >&2
            find "${RUNNER_TEMP}/godot" -maxdepth 3 -type f >&2
            exit 1
          fi
          chmod +x "$godot_bin"
          echo "GODOT_BIN=$godot_bin" >> "$GITHUB_ENV"
          "$godot_bin" --version

      - name: Restore .NET projects
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r project; do
            dotnet restore "$project"
          done < <(find . -name '*.csproj' -not -path './.godot/*' -not -path './artifacts/*' | sort)

      - name: Run VerifyAll
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/ci
          verify_args=()
          if [[ "$GITHUB_REF_NAME" != "main" ]]; then
            verify_args+=(--pr-fast)
          fi
          sh tools/verify-all.sh "${verify_args[@]}" 2>&1 | tee artifacts/ci/verify-all.log

      - name: Capture visual QA
        if: github.ref_name != 'main' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          BATTLE_HUD_CAPTURE_COMMIT: ${{ github.sha }}
          BATTLE_HUD_CAPTURE_RUN_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}
        run: bash tools/VisualQaCapture.sh

      - name: 验证 Battle HUD 证据完整性
        if: github.ref_name != 'main' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          test -s artifacts/visual-qa/battle-hud-runtime-artifact-manifest.json
          test -s artifacts/visual-qa/battle-hud-runtime-structural-evidence.json

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verify-all-${{ github.run_id }}-${{ github.sha }}
          path: |
            artifacts/active-battle-perf/*.txt
            artifacts/ai-opponent-loop/*.json
            artifacts/issue-568/*.json
            artifacts/issue-569/*.json
            artifacts/visual-qa/*.json
            artifacts/visual-qa/*.png
          if-no-files-found: error
          retention-days: 14

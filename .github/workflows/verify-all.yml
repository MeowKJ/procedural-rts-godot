name: VerifyAll

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: verify-all-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_ROLL_FORWARD: Major
  GODOT_VERSION: "4.7"
  GODOT_RELEASE: "stable"

jobs:
  verify-all:
    name: VerifyAll
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Install Godot .NET
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/godot"
          archive="${RUNNER_TEMP}/godot/godot-dotnet.zip"
          release="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_mono_linux_x86_64.zip"
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 300 "$release" --output "$archive"
          unzip -q "$archive" -d "${RUNNER_TEMP}/godot"
          godot_bin="$(find "${RUNNER_TEMP}/godot" -type f -name "Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_mono_linux.x86_64" | head -n 1)"
          if [ -z "$godot_bin" ]; then
            echo "Godot .NET executable was not found after extracting $archive" >&2
            find "${RUNNER_TEMP}/godot" -maxdepth 3 -type f >&2
            exit 1
          fi
          chmod +x "$godot_bin"
          echo "GODOT_BIN=$godot_bin" >> "$GITHUB_ENV"
          "$godot_bin" --version

      - name: Restore .NET projects
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r project; do
            dotnet restore "$project"
          done < <(find . -name '*.csproj' -not -path './.godot/*' -not -path './artifacts/*' | sort)

      - name: Run VerifyAll
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/ci
          sh tools/verify-all.sh 2>&1 | tee artifacts/ci/verify-all.log

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-all-${{ github.run_id }}
          path: |
            artifacts/**
          if-no-files-found: ignore

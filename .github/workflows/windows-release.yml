name: Windows Release Package

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: '4.7'
  GODOT_RELEASE: 'stable'
  RELEASE_COMMIT: ${{ github.sha }}

jobs:
  package:
    name: Windows package and clean extract
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Verify trusted trigger policy
        shell: pwsh
        run: |
          $workflow = Get-Content -LiteralPath '.github/workflows/windows-release.yml' -Raw
          $forbiddenTrigger = 'pull' + '_request(?:_target)?\s*:'
          if ($workflow -match $forbiddenTrigger) {
            throw 'Windows release workflow must not accept pull-request events.'
          }
          if ($workflow -notmatch '(?m)^\s*workflow_dispatch\s*:') {
            throw 'Windows release workflow must retain maintainer-controlled workflow_dispatch.'
          }
          Write-Host 'Trusted Windows release workflow policy verified.'

      - name: Verify Godot template version mapping
        shell: pwsh
        run: ./tools/WindowsReleaseModuleQa.ps1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Restore package dependencies
        shell: pwsh
        run: |
          dotnet restore ProceduralRts.csproj
          dotnet restore tools/ReleaseIdentityQa/ReleaseIdentityQa.csproj

      - name: Verify release identity mapping
        shell: pwsh
        run: dotnet run --project tools/ReleaseIdentityQa/ReleaseIdentityQa.csproj --no-restore

      - name: Install Godot Mono and export templates
        id: godot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = "https://github.com/godotengine/godot-builds/releases/download/${env:GODOT_VERSION}-${env:GODOT_RELEASE}"
          $archive = Join-Path $env:RUNNER_TEMP "godot-mono.zip"
          Invoke-WebRequest -Uri "$base/Godot_v${env:GODOT_VERSION}-${env:GODOT_RELEASE}_mono_win64.zip" -OutFile $archive
          $destination = Join-Path $env:RUNNER_TEMP 'godot'
          Expand-Archive -LiteralPath $archive -DestinationPath $destination -Force
          $godot = Get-ChildItem -LiteralPath $destination -Recurse -File -Filter '*_console.exe' | Select-Object -First 1
          if ($null -eq $godot) { throw 'Godot Mono console executable was not found.' }
          $godotPath = $godot.FullName
          $godotVersion = (& $godotPath --version | Out-String).Trim()
          if ([string]::IsNullOrWhiteSpace($godotVersion)) { throw 'Godot Mono console executable did not report a version.' }
          Import-Module ./tools/WindowsRelease.psm1 -Force
          $templateVersion = Get-GodotExportTemplateVersion $godotVersion
          $templateTgz = Join-Path $env:RUNNER_TEMP 'godot-templates.tpz'
          Invoke-WebRequest -Uri "$base/Godot_v${env:GODOT_VERSION}-${env:GODOT_RELEASE}_mono_export_templates.tpz" -OutFile $templateTgz
          $templateZip = Join-Path $env:RUNNER_TEMP 'godot-templates.zip'
          Copy-Item -LiteralPath $templateTgz -Destination $templateZip -Force
          $templateExtractRoot = Join-Path $env:RUNNER_TEMP 'godot-templates-extracted'
          Expand-Archive -LiteralPath $templateZip -DestinationPath $templateExtractRoot -Force
          $templateSource = Join-Path $templateExtractRoot 'templates'
          if (-not (Test-Path -LiteralPath $templateSource)) { throw 'Godot export template archive is missing its templates directory.' }
          $requiredTemplates = @('version.txt', 'windows_debug_x86_64.exe', 'windows_release_x86_64.exe')
          foreach ($template in $requiredTemplates) {
            if (-not (Test-Path -LiteralPath (Join-Path $templateSource $template) -PathType Leaf)) {
              throw "Godot export template archive is missing: templates/$template"
            }
          }
          $templateArchiveVersion = (Get-Content -LiteralPath (Join-Path $templateSource 'version.txt') -Raw).Trim()
          if ($templateArchiveVersion -ne $templateVersion) {
            throw "Godot template version '$templateArchiveVersion' is incompatible with editor '$godotVersion'."
          }
          $templateDestination = Join-Path $env:APPDATA "Godot\export_templates\$templateVersion"
          New-Item -ItemType Directory -Force -Path $templateDestination | Out-Null
          Get-ChildItem -LiteralPath $templateSource -Force | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination $templateDestination -Recurse -Force
          }
          foreach ($template in $requiredTemplates) {
            if (-not (Test-Path -LiteralPath (Join-Path $templateDestination $template))) {
              throw "Godot export template was not installed at the expected path: $template"
            }
          }
          "godot=$godotPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Package exact commit
        shell: pwsh
        run: |
          ./tools/PackageWindowsRelease.ps1 -GodotPath '${{ steps.godot.outputs.godot }}' -Commit $env:RELEASE_COMMIT -OutputRoot builds/release

      - name: Re-run clean extract smoke
        shell: pwsh
        run: ./tools/TestWindowsReleasePackage.ps1 -ReleaseRoot builds/release

      - name: Upload release-package evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release-package-${{ github.run_id }}
          path: builds/release/**
          if-no-files-found: error
          retention-days: 14

name: VerifyAll PR Status
run-name: VerifyAll PR 中文状态 · ${{ github.event.workflow_run.id }}

on:
  workflow_run:
    workflows:
      - VerifyAll
    types:
      - requested
      - completed

permissions:
  actions: read
  pull-requests: write

concurrency:
  group: verify-all-pr-status-${{ github.event.workflow_run.head_repository.full_name || github.repository }}-${{ github.event.workflow_run.head_branch || github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  pr-status:
    name: 更新 VerifyAll 状态评论
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: 更新 PR 中文状态评论
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const eventRun = context.payload.workflow_run;
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: eventRun.id,
            });

            const candidateNumbers = new Set(
              (run.pull_requests || [])
                .map(candidate => candidate.number)
                .filter(number => Number.isInteger(number)));
            const associated = await github.paginate(
              github.rest.repos.listPullRequestsAssociatedWithCommit,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: run.head_sha,
                per_page: 100,
              });
            for (const candidate of associated) {
              candidateNumbers.add(candidate.number);
            }

            const pullRequests = [];
            for (const pullNumber of [...candidateNumbers].sort((left, right) => left - right)) {
              const { data: candidate } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pullNumber,
              });
              if (candidate.state === "open" && candidate.head.sha === run.head_sha) {
                pullRequests.push(candidate);
              }
            }

            if (pullRequests.length === 0) {
              core.notice(`VerifyAll 运行 ${run.id} 未关联精确 head 的开放 PR，跳过状态评论。`);
              return;
            }

            const marker = "<!-- verify-all-status -->";
            const completed = run.status === "completed";
            const conclusion = run.conclusion || "pending";
            const status = !completed
              ? "status:ci-pending"
              : conclusion === "success"
                ? "status:verified"
                : "status:needs-fix";
            const displayStatus = !completed
              ? "⏳ 排队或运行中"
              : conclusion === "success"
                ? "✅ 通过"
                : "❌ 失败";
            const runUrl = run.html_url;
            const headSha = (run.head_sha || "").slice(0, 12);
            const completedAt = run.updated_at || run.created_at;

            for (const pullRequest of pullRequests) {
              const next = !completed
                ? `无需在当前会话等待；后续由监控器或集成者运行 \`sh tools/ci-monitor.sh ${pullRequest.number}\`。`
                : conclusion === "success"
                  ? "集成者可以继续核对审查线程和精确 head 合并门禁。"
                  : `Owner 应使用 \`sh tools/ci-failure-tail.sh ${run.id} 180\` 读取有限失败日志。`;
              const body = [
                marker,
                `<!-- verify-all-meta schema=1 run=${run.id} head=${run.head_sha} state=${status} -->`,
                `**完整验证：** ${displayStatus}`,
                `**机器状态：** \`${status}\``,
                `**运行记录：** [${run.id}](${runUrl})`,
                `**精确提交：** \`${headSha}\``,
                `**更新时间：** ${completedAt}`,
                `**下一步：** ${next}`,
              ].join("\n");

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullRequest.number,
                per_page: 100,
              });
              const existing = comments.find(comment =>
                comment.user?.type === "Bot" && comment.body?.includes(marker));
              const metadataRunMatch = existing?.body?.match(/<!-- verify-all-meta\s+schema=1\s+run=(\d+)\b/);
              const legacyRunMatch = existing?.body?.match(/\*\*Run:\*\*\s*\[(\d+)\]/);
              const existingRunMatch = metadataRunMatch || legacyRunMatch;
              const existingRunId = existingRunMatch ? Number(existingRunMatch[1]) : null;
              if (existingRunId !== null && existingRunId > run.id) {
                core.notice(`PR #${pullRequest.number} 已指向较新的 VerifyAll 运行 ${existingRunId}，跳过旧运行 ${run.id}。`);
                continue;
              }

              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pullRequest.number,
                  body,
                });
              }
            }
